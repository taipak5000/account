<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1e3a">
  <title>アカウント管理 | サブキャンドル管理</title>
  <style>
    /* ============================================================
       デザイントークン（ライト / ダーク）
       旧版のiOS風パレットを土台に、階調と余白を整えて高級感を出す。
       ダークは端末設定に追従しつつ、右上のボタンで手動切替もできる。
       ============================================================ */
    :root {
      --blue: #007aff;
      --blue-d: #0051a8;
      --green: #34c759;
      --red: #ff3b30;
      --orange: #ff9500;
      --gold: #ffcf4d;
      --bg: #eceef3;
      --bg-grad: linear-gradient(180deg, #f4f5f9 0%, #eceef3 240px);
      --card: #ffffff;
      --card-border: rgba(15, 23, 42, 0.06);
      --text: #111318;
      --text-2: #5b6068;
      --text-3: #9a9ea8;
      --input-bg: #f1f2f6;
      --input-border: rgba(15, 23, 42, 0.08);
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.05), 0 8px 24px -12px rgba(16, 24, 40, 0.18);
      --hero-grad: linear-gradient(135deg, #071a38 0%, #0b3d91 58%, #0077b6 100%);
      --chip-bg: #eef0f5;
      --danger-ghost-bg: rgba(255, 59, 48, 0.08);
      color-scheme: light;
    }
    [data-theme="dark"] {
      --bg: #0b0d12;
      --bg-grad: linear-gradient(180deg, #10131a 0%, #0b0d12 240px);
      --card: #171a21;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f2f3f7;
      --text-2: #a7abb6;
      --text-3: #6d727e;
      --input-bg: #10131a;
      --input-border: rgba(255, 255, 255, 0.12);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px -12px rgba(0, 0, 0, 0.7);
      --chip-bg: #22262f;
      --danger-ghost-bg: rgba(255, 69, 58, 0.14);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", Helvetica, Arial, sans-serif;
      background: var(--bg);
      background-image: var(--bg-grad);
      background-repeat: no-repeat;
      color: var(--text);
      margin: 0;
      padding: 20px 12px 48px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 680px; margin: 0 auto; }

    /* ── ヒーロー（合計サマリー） ─────────────────────────── */
    .hero {
      background: var(--hero-grad);
      border-radius: 20px;
      padding: 20px 20px 18px;
      color: #fff;
      box-shadow: 0 12px 32px -12px rgba(7, 26, 56, 0.55);
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: ""; position: absolute; right: -40px; top: -60px; width: 190px; height: 190px;
      background: radial-gradient(circle, rgba(255, 207, 77, 0.35) 0%, rgba(255, 207, 77, 0) 70%);
      pointer-events: none;
    }
    .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .hero h1 { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: 0.02em; }
    .hero-sub { margin: 4px 0 0; font-size: 12.5px; color: rgba(255, 255, 255, 0.72); }
    .theme-toggle {
      flex-shrink: 0; width: 38px; height: 38px; padding: 0; border-radius: 50%;
      background: rgba(255, 255, 255, 0.14); color: #fff; font-size: 17px;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }
    .hero-stats { display: flex; align-items: flex-end; gap: 26px; margin-top: 16px; flex-wrap: wrap; }
    .hero-total-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; color: rgba(255, 255, 255, 0.66); }
    .hero-total-value {
      font-size: 44px; font-weight: 800; line-height: 1.05; color: var(--gold);
      font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
    }
    .hero-total-value .unit { font-size: 18px; font-weight: 700; margin-left: 3px; }
    .hero-mini { padding-bottom: 6px; }
    .hero-mini-value { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .hero-mini-label { font-size: 11px; color: rgba(255, 255, 255, 0.66); margin-top: 1px; }

    h2 {
      font-size: 13px; font-weight: 700; color: var(--text-2);
      margin: 24px 0 8px 6px; letter-spacing: 0.06em;
      display: flex; align-items: center; gap: 8px;
    }
    h2 .h2-note { font-size: 11px; font-weight: 500; color: var(--text-3); letter-spacing: 0; }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
    }

    /* ── フォーム ───────────────────────────────────────── */
    .form-group { display: flex; flex-direction: column; gap: 12px; }
    .field label { display: block; font-size: 12px; font-weight: 700; color: var(--text-2); margin: 0 0 5px 2px; }
    .field label .req { color: var(--red); font-weight: 700; }
    .input-row { display: flex; gap: 10px; }
    .input-row .field { flex: 1; min-width: 0; }
    input[type="text"], input[type="number"], select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 16px; /* iOSのズーム防止のため16px以上 */
      color: var(--text);
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.18); background: var(--card); }
    input::placeholder { color: var(--text-3); }
    .form-error { display: none; font-size: 13px; color: var(--red); font-weight: 600; margin: -2px 0 0 2px; }
    .form-error.show { display: block; }

    button {
      background: var(--blue); color: #fff; border: none; border-radius: 10px;
      padding: 12px 16px; font-size: 15.5px; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: filter 0.15s, transform 0.05s, opacity 0.2s;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { filter: brightness(1.07); }
    button:active { transform: scale(0.98); opacity: 0.85; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
    .btn-block { width: 100%; }
    .btn-primary-grad { background: linear-gradient(180deg, #2f8bff, var(--blue)); box-shadow: 0 6px 16px -8px rgba(0, 122, 255, 0.8); }
    .btn-green { background: var(--green); }
    .btn-red { background: var(--red); }
    .btn-orange { background: var(--orange); }
    .btn-gray { background: #8e8e93; }
    .btn-ghost {
      background: var(--chip-bg); color: var(--text); box-shadow: none; font-size: 14px; padding: 10px 14px;
    }
    .btn-ghost.danger { background: var(--danger-ghost-bg); color: var(--red); }

    /* ── 一括変更 ───────────────────────────────────────── */
    .batch-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .batch-actions select { flex: 1; min-width: 150px; width: auto; }
    .shortcut-btns { display: flex; gap: 8px; }
    .shortcut-btns button { min-width: 58px; font-variant-numeric: tabular-nums; }
    .custom-batch { display: flex; gap: 8px; width: 100%; }
    .custom-batch input { flex: 1; }
    .batch-note { font-size: 12px; color: var(--text-2); margin: 2px 0 0 2px; }
    .batch-note b { color: var(--text); font-variant-numeric: tabular-nums; }

    /* ── バックアップ ───────────────────────────────────── */
    .backup-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .backup-row button { flex: 1; min-width: 140px; }
    .backup-note { font-size: 12px; color: var(--text-2); line-height: 1.6; margin: 10px 0 0 2px; }

    /* ── 一覧ツールバー ─────────────────────────────────── */
    .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
    .toolbar-row { display: flex; gap: 8px; }
    .toolbar-row .search-wrap { flex: 1; min-width: 0; position: relative; }
    .toolbar-row select { width: auto; flex-shrink: 0; max-width: 46%; }
    .group-chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
    .group-chips::-webkit-scrollbar { display: none; }
    .group-chip {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px;
      background: var(--card); border: 1.5px solid var(--card-border); color: var(--text);
      border-radius: 999px; padding: 8px 13px; font-size: 13px; font-weight: 700;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06); cursor: pointer;
    }
    .group-chip .chip-total { font-size: 11.5px; font-weight: 600; color: var(--text-2); font-variant-numeric: tabular-nums; }
    .group-chip.active { border-color: var(--blue); background: rgba(0, 122, 255, 0.08); }
    .gdot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

    /* ── アカウント行 ───────────────────────────────────── */
    .account-list { display: flex; flex-direction: column; gap: 10px; }
    .account-item {
      display: flex; align-items: center; gap: 12px;
      background: var(--card); border: 1px solid var(--card-border);
      border-left: 5px solid var(--text-3);
      border-radius: 14px; padding: 13px 14px;
      box-shadow: var(--shadow);
    }
    .account-info { flex: 1; min-width: 0; }
    .account-name {
      font-size: 16.5px; font-weight: 700; margin-bottom: 5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .account-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .meta-chip {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11.5px; font-weight: 600; color: var(--text-2);
      background: var(--chip-bg); border-radius: 999px; padding: 3px 9px;
      max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .meta-chip.group { font-weight: 700; }
    .account-side { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex-shrink: 0; }
    .candle-stepper { display: flex; align-items: center; gap: 6px; }
    .step-btn {
      width: 34px; height: 38px; padding: 0; border-radius: 9px; font-size: 17px; font-weight: 800;
      background: var(--chip-bg); color: var(--blue); box-shadow: none;
    }
    .step-btn.minus { color: var(--red); }
    .step-btn.wide { width: auto; padding: 0 11px; font-size: 14.5px; }
    .candle-input {
      width: 74px !important; text-align: center; padding: 7px 4px !important;
      font-size: 21px !important; font-weight: 800; font-variant-numeric: tabular-nums;
      background: transparent !important; border: 1px solid transparent !important; border-radius: 9px !important;
    }
    .candle-input:hover { border-color: var(--input-border) !important; }
    .candle-input:focus { background: var(--input-bg) !important; border-color: var(--blue) !important; box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15); }
    .candle-unit { font-size: 11px; color: var(--text-3); font-weight: 700; margin-left: -3px; }
    .row-actions { display: flex; align-items: center; gap: 4px; }
    .row-actions .sort-btns { display: flex; gap: 4px; margin-right: 2px; }
    .btn-sort {
      background: var(--chip-bg); color: var(--blue); padding: 0; width: 26px; height: 26px;
      font-size: 10px; border-radius: 7px; box-shadow: none; line-height: 1;
    }
    .btn-sort:disabled { color: var(--text-3); cursor: not-allowed; filter: none; }
    .btn-text {
      background: none; color: var(--blue); box-shadow: none; padding: 5px 8px;
      font-size: 13px; font-weight: 700; border-radius: 7px;
    }
    .btn-text.danger { color: var(--red); }
    .btn-text:hover { background: var(--chip-bg); filter: none; }

    .empty-state { text-align: center; color: var(--text-2); padding: 26px 10px; font-size: 14.5px; line-height: 1.8; }
    .empty-state .empty-icon { font-size: 34px; display: block; margin-bottom: 6px; }
    .empty-state button { margin-top: 10px; }

    .editing-highlight { border: 2px solid var(--orange) !important; background: #fff9f0 !important; }
    [data-theme="dark"] .editing-highlight { background: #2a2113 !important; }

    /* ── トースト（取り消し付き） ───────────────────────── */
    .toast {
      position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(16px);
      background: rgba(24, 26, 32, 0.96); color: #fff; border-radius: 999px;
      padding: 10px 12px 10px 18px; font-size: 13.5px; font-weight: 600;
      display: flex; align-items: center; gap: 12px; opacity: 0; pointer-events: none;
      transition: opacity 0.22s, transform 0.22s; z-index: 1000; max-width: calc(100vw - 32px);
      box-shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.5);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast .toast-undo {
      background: rgba(255, 255, 255, 0.16); color: var(--gold); padding: 6px 12px;
      font-size: 13px; border-radius: 999px; box-shadow: none; flex-shrink: 0;
    }
    .footer-note { text-align: center; font-size: 11.5px; color: var(--text-3); line-height: 1.7; margin-top: 26px; }

    @media (max-width: 480px) {
      .hero-total-value { font-size: 38px; }
      .account-item { flex-wrap: wrap; }
      .account-side { flex-direction: row; align-items: center; width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 合計サマリー -->
    <header class="hero">
      <div class="hero-top">
        <div>
          <h1>🕯️ アカウント管理</h1>
          <p class="hero-sub">サブアカウントのキャンドル数をまとめて管理</p>
        </div>
        <button type="button" class="theme-toggle" id="btn-theme" onclick="cycleTheme()" aria-label="表示テーマを切り替える">🌙</button>
      </div>
      <div class="hero-stats">
        <div>
          <div class="hero-total-label">キャンドル合計</div>
          <div class="hero-total-value"><span id="stat-total">0</span><span class="unit">本</span></div>
        </div>
        <div class="hero-mini">
          <div class="hero-mini-value" id="stat-accounts">0</div>
          <div class="hero-mini-label">アカウント</div>
        </div>
        <div class="hero-mini">
          <div class="hero-mini-value" id="stat-groups">0</div>
          <div class="hero-mini-label">グループ</div>
        </div>
      </div>
    </header>

    <h2 id="form-title">新規アカウント登録</h2>
    <div class="card" id="form-card">
      <form class="form-group" id="account-form" onsubmit="handleSubmit(event)">
        <div class="field">
          <label for="input-name">アカウント名 <span class="req">*必須</span></label>
          <input type="text" id="input-name" placeholder="例: サブ1号機" autocomplete="off">
        </div>
        <div class="input-row">
          <div class="field">
            <label for="input-device">機種</label>
            <input type="text" id="input-device" placeholder="例: iPhone 15" list="device-list" autocomplete="off">
          </div>
          <div class="field">
            <label for="input-group">グループ</label>
            <input type="text" id="input-group" placeholder="例: メイン" list="group-list" autocomplete="off">
          </div>
        </div>
        <datalist id="device-list"></datalist>
        <datalist id="group-list"></datalist>
        <div class="field">
          <label for="input-candles">キャンドル数</label>
          <input type="number" id="input-candles" value="0" min="0">
        </div>
        <p class="form-error" id="form-error">アカウント名を入力してください。</p>
        <button type="submit" class="btn-block btn-primary-grad" id="btn-submit">アカウントを追加</button>
        <button type="button" class="btn-block btn-gray" id="btn-cancel-edit" onclick="cancelEdit()" style="display: none;">編集をキャンセル</button>
      </form>
    </div>

    <h2>キャンドル数 一括変更</h2>
    <div class="card">
      <div class="form-group">
        <div class="batch-actions">
          <select id="batch-target" onchange="onBatchTargetChange()" aria-label="一括変更の対象">
            <option value="ALL">全体（すべて）</option>
          </select>
          <div class="shortcut-btns">
            <button type="button" class="btn-green" onclick="applyBatchChange(2)">+2</button>
            <button type="button" class="btn-red" onclick="applyBatchChange(-6)">-6</button>
          </div>
        </div>
        <div class="custom-batch">
          <input type="number" id="batch-custom-value" placeholder="任意の数値を入力 (例: 10, -5)" aria-label="任意の増減値">
          <button type="button" onclick="applyCustomBatchChange()">適用</button>
        </div>
        <p class="batch-note" id="batch-note"></p>
      </div>
    </div>

    <h2>登録アカウント一覧 <span class="h2-note" id="list-count"></span></h2>
    <div class="toolbar">
      <div class="group-chips" id="group-chips"></div>
      <div class="toolbar-row">
        <div class="search-wrap">
          <input type="text" id="input-search" placeholder="名前・機種・グループで検索" autocomplete="off" oninput="onSearchInput(this.value)">
        </div>
        <select id="select-sort" onchange="onSortChange(this.value)" aria-label="並び順">
          <option value="manual">手動の並び順</option>
          <option value="candles-desc">キャンドル多い順</option>
          <option value="candles-asc">キャンドル少ない順</option>
          <option value="name">名前順</option>
        </select>
      </div>
    </div>
    <div id="account-list" class="account-list"></div>

    <h2>データのバックアップ</h2>
    <div class="card">
      <div class="backup-row">
        <button type="button" class="btn-ghost" onclick="exportData()">⬇ 書き出す（保存）</button>
        <button type="button" class="btn-ghost" onclick="document.getElementById('import-file').click()">⬆ 読み込む（復元）</button>
        <input type="file" id="import-file" accept="application/json,.json" style="display:none" onchange="importData(this)">
      </div>
      <p class="backup-note" id="backup-note">データはこの端末のブラウザ内にだけ保存されます。機種変更やブラウザのデータ消去で消えてしまうため、ときどき書き出して保管してください。読み込みは書き出したファイルと互換性があります（旧バージョンで書き出したファイルもそのまま使えます）。</p>
    </div>

    <p class="footer-note">データはこの端末内（ブラウザのローカルストレージ）に保存され、外部に送信されることはありません。</p>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    /* ============================================================
       データ保存について（互換性の約束）
       - 保存キーとJSONの形は旧バージョンと完全に同一：
         localStorage['ios_account_manager_data_v3'] = { accounts: [{id, name, device, group, candles}], nextId }
       - 旧バージョンで保存したデータはそのまま読み込め、書き出した
         バックアップファイルも相互に互換。
       - 画面の好み（テーマ・並び順・フィルター）は別のキー
         'subcandle_ui_v1' に分けて保存し、本体データには混ぜない。
       ============================================================ */
    const STORAGE_KEY = 'ios_account_manager_data_v3';
    const UI_KEY = 'subcandle_ui_v1';

    let accounts = [];
    let nextId = 1;
    let editingId = null; // 現在編集中のアカウントID（nullなら新規登録モード）

    // 画面状態（本体データとは別キーに保存）
    let ui = { theme: null, sort: 'manual', groupFilter: 'ALL', lastExport: null };
    let searchQuery = ''; // 検索語は開き直したときに残らないよう保存しない
    let undoSnapshot = null; // 一括変更・削除の直前スナップショット（1回分）

    // グループごとの色リスト（旧版と同一パレット。行全体ではなく
    // 左端のバー・ドット・グループ名チップにだけ使って安っぽさを抑える）
    const groupColors = [
      { bg: '#e1f5fe', text: '#0288d1' }, // ライトブルー
      { bg: '#e8f5e9', text: '#2e7d32' }, // ライトグリーン
      { bg: '#fff3e0', text: '#e65100' }, // ライトオレンジ
      { bg: '#f3e5f5', text: '#6a1b9a' }, // ライトパープル
      { bg: '#fce4ec', text: '#c2185b' }, // ライトピンク
      { bg: '#e0f2f1', text: '#00695c' }, // ミントグリーン
      { bg: '#fffde7', text: '#f9a825' }  // ライトイエロー（旧版の #f57f17 は薄地で読みにくいため少し濃く）
    ];

    /* ── 保存・読み込み（本体データ：旧版と同一仕様） ── */
    function loadData() {
      const savedData = localStorage.getItem(STORAGE_KEY);
      if (savedData) {
        try {
          const parsed = JSON.parse(savedData);
          accounts = Array.isArray(parsed.accounts) ? parsed.accounts : [];
          nextId = parsed.nextId || 1;
        } catch (e) {
          console.error("データの読み込みに失敗しました。", e);
        }
      }
    }
    function saveData() {
      const dataToSave = { accounts: accounts, nextId: nextId };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
    }

    /* ── 保存・読み込み（画面の好み：別キー） ── */
    function loadUi() {
      try {
        const raw = localStorage.getItem(UI_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          if (p && typeof p === 'object') {
            if (p.theme === 'dark' || p.theme === 'light') ui.theme = p.theme;
            if (['manual', 'candles-desc', 'candles-asc', 'name'].includes(p.sort)) ui.sort = p.sort;
            if (typeof p.groupFilter === 'string') ui.groupFilter = p.groupFilter;
            if (typeof p.lastExport === 'string') ui.lastExport = p.lastExport;
          }
        }
      } catch (e) { /* 読めなくても本体機能には影響させない */ }
    }
    function saveUi() {
      try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (e) { /* 同上 */ }
    }

    /* ── テーマ ── */
    function resolvedTheme() {
      if (ui.theme) return ui.theme;
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    function applyTheme() {
      const t = resolvedTheme();
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('btn-theme').textContent = t === 'dark' ? '☀️' : '🌙';
    }
    function cycleTheme() {
      ui.theme = resolvedTheme() === 'dark' ? 'light' : 'dark';
      saveUi();
      applyTheme();
    }

    /* ── 共通ヘルパー ── */
    // 名前・機種・グループはユーザー入力をそのままHTMLに差し込むため、
    // 必ずエスケープしてから埋め込む（旧版は未エスケープで、名前に < 等が
    // 入ると表示が壊れたりHTMLが混入したりした）
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function clampCandles(n) { return Math.max(0, n | 0); } // キャンドル数はマイナスにしない
    function groupColorMap() {
      const map = new Map();
      let idx = 0;
      accounts.forEach(acc => {
        if (!map.has(acc.group)) { map.set(acc.group, groupColors[idx % groupColors.length]); idx++; }
      });
      return map;
    }
    function groupNames() { return Array.from(groupColorMap().keys()); }
    function totals() {
      let total = 0;
      const perGroup = new Map();
      accounts.forEach(acc => {
        total += acc.candles || 0;
        const g = perGroup.get(acc.group) || { count: 0, total: 0 };
        g.count++; g.total += acc.candles || 0;
        perGroup.set(acc.group, g);
      });
      return { total, perGroup };
    }
    function takeUndoSnapshot() {
      undoSnapshot = JSON.stringify({ accounts: accounts, nextId: nextId });
    }
    function undoLast() {
      if (!undoSnapshot) return;
      try {
        const p = JSON.parse(undoSnapshot);
        accounts = p.accounts || [];
        nextId = p.nextId || 1;
        saveData();
      } catch (e) { /* 復元できなければ何もしない */ }
      undoSnapshot = null;
      hideToast();
      render();
      showToast('元に戻しました');
    }

    /* ── トースト ── */
    let toastTimer = null;
    function showToast(msg, withUndo) {
      const el = document.getElementById('toast');
      el.innerHTML = '';
      const span = document.createElement('span');
      span.textContent = msg;
      el.appendChild(span);
      if (withUndo) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'toast-undo';
        btn.textContent = '元に戻す';
        btn.onclick = undoLast;
        el.appendChild(btn);
      }
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, withUndo ? 6000 : 2600);
    }
    function hideToast() { document.getElementById('toast').classList.remove('show'); }

    /* ── 登録 / 編集 ── */
    function handleSubmit(ev) {
      if (ev) ev.preventDefault();
      const nameEl = document.getElementById('input-name');
      const name = nameEl.value.trim();
      const device = document.getElementById('input-device').value.trim() || '未指定';
      const group = document.getElementById('input-group').value.trim() || '未分類';
      const candles = clampCandles(parseInt(document.getElementById('input-candles').value) || 0);
      const errEl = document.getElementById('form-error');

      if (!name) {
        errEl.classList.add('show');
        nameEl.focus();
        return;
      }
      errEl.classList.remove('show');

      if (editingId !== null) {
        const account = accounts.find(acc => acc.id === editingId);
        if (account) {
          account.name = name;
          account.device = device;
          account.group = group;
          account.candles = candles;
        }
        cancelEdit();
        showToast('変更を保存しました');
      } else {
        accounts.push({ id: nextId++, name: name, device: device, group: group, candles: candles });
        resetForm();
        nameEl.focus();
        showToast('アカウントを追加しました');
      }
      saveData();
      render();
    }

    function startEdit(id) {
      const account = accounts.find(acc => acc.id === id);
      if (!account) return;
      editingId = id;
      document.getElementById('input-name').value = account.name;
      document.getElementById('input-device').value = account.device;
      document.getElementById('input-group').value = account.group;
      document.getElementById('input-candles').value = account.candles;
      document.getElementById('form-title').textContent = 'アカウント情報の編集';
      const submitBtn = document.getElementById('btn-submit');
      submitBtn.textContent = '変更を保存';
      submitBtn.classList.remove('btn-primary-grad');
      submitBtn.classList.add('btn-orange');
      document.getElementById('btn-cancel-edit').style.display = 'block';
      document.getElementById('form-card').classList.add('editing-highlight');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      document.getElementById('input-name').focus({ preventScroll: true });
    }

    function cancelEdit() {
      editingId = null;
      resetForm();
      document.getElementById('form-title').textContent = '新規アカウント登録';
      const submitBtn = document.getElementById('btn-submit');
      submitBtn.textContent = 'アカウントを追加';
      submitBtn.classList.add('btn-primary-grad');
      submitBtn.classList.remove('btn-orange');
      document.getElementById('btn-cancel-edit').style.display = 'none';
      document.getElementById('form-card').classList.remove('editing-highlight');
      document.getElementById('form-error').classList.remove('show');
    }

    function resetForm() {
      document.getElementById('input-name').value = '';
      document.getElementById('input-device').value = '';
      document.getElementById('input-group').value = '';
      document.getElementById('input-candles').value = '0';
    }

    /* ── 個別のキャンドル変更 ── */
    function updateSingleCandle(id, value) {
      const account = accounts.find(acc => acc.id === id);
      if (account) {
        account.candles = clampCandles(parseInt(value) || 0);
        saveData();
        renderSummaryAndChips();
      }
    }
    function stepCandle(id, delta) {
      const account = accounts.find(acc => acc.id === id);
      if (!account) return;
      account.candles = clampCandles((account.candles || 0) + delta);
      saveData();
      render();
    }

    /* ── 削除・並び替え ── */
    function deleteAccount(id) {
      if (confirm('このアカウントを削除してもよろしいですか？')) {
        takeUndoSnapshot();
        if (editingId === id) cancelEdit();
        accounts = accounts.filter(acc => acc.id !== id);
        saveData();
        render();
        showToast('アカウントを削除しました', true);
      }
    }
    function moveAccount(id, direction) {
      const index = accounts.findIndex(acc => acc.id === id);
      if (index === -1) return;
      if (direction === 'up' && index > 0) {
        const temp = accounts[index]; accounts[index] = accounts[index - 1]; accounts[index - 1] = temp;
      } else if (direction === 'down' && index < accounts.length - 1) {
        const temp = accounts[index]; accounts[index] = accounts[index + 1]; accounts[index + 1] = temp;
      }
      saveData();
      render();
    }

    /* ── 一括変更 ── */
    function batchTargets() {
      const targetGroup = document.getElementById('batch-target').value;
      return accounts.filter(acc => targetGroup === 'ALL' || acc.group === targetGroup);
    }
    function renderBatchNote() {
      const targetGroup = document.getElementById('batch-target').value;
      const n = batchTargets().length;
      document.getElementById('batch-note').innerHTML =
        '対象は <b>' + n + '件</b> です。適用すると対象アカウントのキャンドル数がまとめて増減します（0未満にはなりません）。' +
        (targetGroup === 'ALL' ? '' : '<br>下の登録一覧もこのグループで絞り込んで表示しています。');
    }
    // 一括変更の対象グループを選んだら、下の登録一覧の表示も同じグループに連動させる
    // （「全体」に戻せば一覧も全表示に戻る）。一覧側のチップ操作は今までどおり単独でも使える。
    function onBatchTargetChange() {
      setGroupFilter(document.getElementById('batch-target').value);
      renderBatchNote();
    }
    function applyBatchChange(amount) {
      const targets = batchTargets();
      if (!targets.length) { showToast('対象のアカウントがありません'); return; }
      takeUndoSnapshot();
      let clamped = 0;
      targets.forEach(acc => {
        const next = (acc.candles || 0) + amount;
        if (next < 0) clamped++;
        acc.candles = clampCandles(next);
      });
      saveData();
      render();
      showToast(targets.length + '件に ' + (amount > 0 ? '+' : '') + amount + ' を適用しました' + (clamped ? '（' + clamped + '件は0で止めました）' : ''), true);
    }
    function applyCustomBatchChange() {
      const input = document.getElementById('batch-custom-value');
      const customValue = parseInt(input.value);
      if (isNaN(customValue) || customValue === 0) {
        showToast('0以外の数値を入力してください');
        input.focus();
        return;
      }
      applyBatchChange(customValue);
      input.value = '';
    }

    /* ── バックアップ（書き出し / 読み込み） ── */
    function exportData() {
      const payload = JSON.stringify({ accounts: accounts, nextId: nextId }, null, 2);
      const blob = new Blob([payload], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const now = new Date();
      const ymd = now.getFullYear() + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
      const a = document.createElement('a');
      a.href = url;
      a.download = 'account-candles-backup-' + ymd + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      ui.lastExport = now.toLocaleDateString('ja-JP');
      saveUi();
      renderBackupNote();
      showToast('バックアップを書き出しました');
    }
    function renderBackupNote() {
      const base = 'データはこの端末のブラウザ内にだけ保存されます。機種変更やブラウザのデータ消去で消えてしまうため、ときどき書き出して保管してください。読み込みは書き出したファイルと互換性があります（旧バージョンで書き出したファイルもそのまま使えます）。';
      document.getElementById('backup-note').textContent =
        base + (ui.lastExport ? '（前回の書き出し：' + ui.lastExport + '）' : '（まだ書き出したことがありません）');
    }
    function importData(fileInput) {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function () {
        let parsed;
        try { parsed = JSON.parse(String(reader.result)); }
        catch (e) { showToast('ファイルを読み取れませんでした'); return; }
        const clean = validateImport(parsed);
        if (!clean) { showToast('バックアップファイルの形式が違うようです'); return; }
        if (!confirm('現在のデータ（' + accounts.length + '件）を、ファイルの内容（' + clean.accounts.length + '件）で上書きします。よろしいですか？')) return;
        takeUndoSnapshot();
        accounts = clean.accounts;
        nextId = clean.nextId;
        if (editingId !== null) cancelEdit();
        saveData();
        render();
        showToast('バックアップを読み込みました', true);
      };
      reader.onerror = function () { showToast('ファイルを読み取れませんでした'); };
      reader.readAsText(file);
    }
    // 読み込んだJSONを本体データの形に整える。形が違うものは null を返して弾く。
    // 旧バージョンの保存データ・書き出しファイルはそのまま通る。
    function validateImport(parsed) {
      if (!parsed || !Array.isArray(parsed.accounts)) return null;
      const out = [];
      let maxId = 0;
      for (const raw of parsed.accounts) {
        if (!raw || typeof raw !== 'object') return null;
        const id = parseInt(raw.id);
        const name = typeof raw.name === 'string' ? raw.name.trim() : '';
        if (!isFinite(id) || !name) return null;
        out.push({
          id: id,
          name: name,
          device: typeof raw.device === 'string' && raw.device ? raw.device : '未指定',
          group: typeof raw.group === 'string' && raw.group ? raw.group : '未分類',
          candles: clampCandles(parseInt(raw.candles) || 0)
        });
        if (id > maxId) maxId = id;
      }
      const nid = parseInt(parsed.nextId);
      return { accounts: out, nextId: Math.max(isFinite(nid) ? nid : 1, maxId + 1) };
    }

    /* ── 検索・並び替え・フィルター ── */
    function onSearchInput(value) {
      searchQuery = (value || '').trim().toLowerCase();
      renderList();
    }
    function onSortChange(value) {
      ui.sort = value;
      saveUi();
      renderList();
    }
    function setGroupFilter(group) {
      ui.groupFilter = group;
      saveUi();
      renderGroupChips();
      renderList();
    }
    function clearListFilters() {
      searchQuery = '';
      document.getElementById('input-search').value = '';
      setGroupFilter('ALL');
    }
    function visibleAccounts() {
      let list = accounts.slice();
      if (ui.groupFilter !== 'ALL') list = list.filter(acc => acc.group === ui.groupFilter);
      if (searchQuery) {
        list = list.filter(acc =>
          (acc.name || '').toLowerCase().includes(searchQuery) ||
          (acc.device || '').toLowerCase().includes(searchQuery) ||
          (acc.group || '').toLowerCase().includes(searchQuery));
      }
      if (ui.sort === 'candles-desc') list.sort((a, b) => (b.candles || 0) - (a.candles || 0));
      else if (ui.sort === 'candles-asc') list.sort((a, b) => (a.candles || 0) - (b.candles || 0));
      else if (ui.sort === 'name') list.sort((a, b) => String(a.name).localeCompare(String(b.name), 'ja'));
      return list;
    }

    /* ── 描画 ── */
    function render() {
      renderSummaryAndChips();
      renderList();
      renderBatchTargets();
      renderDatalists();
      renderBackupNote();
    }
    function renderSummaryAndChips() {
      const t = totals();
      document.getElementById('stat-total').textContent = t.total.toLocaleString();
      document.getElementById('stat-accounts').textContent = accounts.length.toLocaleString();
      document.getElementById('stat-groups').textContent = t.perGroup.size.toLocaleString();
      renderGroupChips();
    }
    function renderGroupChips() {
      const wrap = document.getElementById('group-chips');
      const t = totals();
      const colors = groupColorMap();
      if (ui.groupFilter !== 'ALL' && !t.perGroup.has(ui.groupFilter)) {
        ui.groupFilter = 'ALL'; // フィルター中のグループが消えたら全体に戻す
      }
      let html = '<button type="button" class="group-chip' + (ui.groupFilter === 'ALL' ? ' active' : '') +
        '" onclick="setGroupFilter(\'ALL\')">すべて<span class="chip-total">' + t.total.toLocaleString() + '本</span></button>';
      t.perGroup.forEach((g, name) => {
        const c = colors.get(name);
        html += '<button type="button" class="group-chip' + (ui.groupFilter === name ? ' active' : '') +
          '" data-group="' + esc(name) + '">' +
          '<span class="gdot" style="background:' + c.text + '"></span>' + esc(name) +
          '<span class="chip-total">' + g.count + '件・' + g.total.toLocaleString() + '本</span></button>';
      });
      wrap.innerHTML = html;
      wrap.querySelectorAll('[data-group]').forEach(btn => {
        btn.addEventListener('click', () => setGroupFilter(btn.getAttribute('data-group')));
      });
    }
    function renderDatalists() {
      const devices = Array.from(new Set(accounts.map(a => a.device).filter(d => d && d !== '未指定')));
      const groups = groupNames().filter(g => g !== '未分類');
      document.getElementById('device-list').innerHTML = devices.map(d => '<option value="' + esc(d) + '">').join('');
      document.getElementById('group-list').innerHTML = groups.map(g => '<option value="' + esc(g) + '">').join('');
    }
    function renderBatchTargets() {
      const select = document.getElementById('batch-target');
      const currentTarget = select.value;
      select.innerHTML = '<option value="ALL">全体（すべて）</option>';
      groupNames().forEach(groupName => {
        const option = document.createElement('option');
        option.value = groupName;
        option.textContent = 'グループ: ' + groupName;
        select.appendChild(option);
      });
      if (Array.from(select.options).some(opt => opt.value === currentTarget)) select.value = currentTarget;
      renderBatchNote();
    }

    function renderList() {
      const listContainer = document.getElementById('account-list');
      const sortSel = document.getElementById('select-sort');
      if (sortSel.value !== ui.sort) sortSel.value = ui.sort;

      if (accounts.length === 0) {
        listContainer.innerHTML =
          '<div class="card"><div class="empty-state"><span class="empty-icon">🕯️</span>' +
          'アカウントが登録されていません。<br>上のフォームから最初の1件を追加してみてください。</div></div>';
        document.getElementById('list-count').textContent = '';
        return;
      }
      const list = visibleAccounts();
      const filtering = ui.groupFilter !== 'ALL' || !!searchQuery;
      document.getElementById('list-count').textContent =
        filtering ? list.length + '件 / 全' + accounts.length + '件' : '全' + accounts.length + '件';

      if (!list.length) {
        listContainer.innerHTML =
          '<div class="card"><div class="empty-state"><span class="empty-icon">🔍</span>' +
          '条件に一致するアカウントがありません。<br>' +
          '<button type="button" class="btn-ghost" onclick="clearListFilters()">フィルターをクリア</button></div></div>';
        return;
      }

      const colors = groupColorMap();
      const manualOrder = ui.sort === 'manual' && !filtering; // 手動の上下ボタンは「素の並び」が見えている時だけ
      listContainer.innerHTML = '';
      list.forEach(acc => {
        const c = colors.get(acc.group) || groupColors[0];
        const index = accounts.findIndex(a => a.id === acc.id);
        const isFirst = index === 0;
        const isLast = index === accounts.length - 1;
        const item = document.createElement('div');
        item.className = 'account-item';
        item.style.borderLeftColor = c.text;
        item.innerHTML =
          '<div class="account-info">' +
            '<div class="account-name">' + esc(acc.name) + '</div>' +
            '<div class="account-meta">' +
              '<span class="meta-chip">📱 ' + esc(acc.device) + '</span>' +
              '<span class="meta-chip group" style="background:' + c.bg + '; color:' + c.text + '">' +
                '<span class="gdot" style="background:' + c.text + '"></span>' + esc(acc.group) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="account-side">' +
            '<div class="candle-stepper">' +
              '<button type="button" class="step-btn wide minus" onclick="stepCandle(' + acc.id + ', -3)" aria-label="' + esc(acc.name) + 'のキャンドルを3減らす">−3</button>' +
              '<button type="button" class="step-btn minus" onclick="stepCandle(' + acc.id + ', -1)" aria-label="' + esc(acc.name) + 'のキャンドルを1減らす">−</button>' +
              '<input type="number" class="candle-input" value="' + (acc.candles || 0) + '" min="0" ' +
                'onchange="updateSingleCandle(' + acc.id + ', this.value)" aria-label="' + esc(acc.name) + 'のキャンドル数">' +
              '<span class="candle-unit">本</span>' +
              '<button type="button" class="step-btn" onclick="stepCandle(' + acc.id + ', 1)" aria-label="' + esc(acc.name) + 'のキャンドルを1増やす">＋</button>' +
            '</div>' +
            '<div class="row-actions">' +
              (manualOrder
                ? '<span class="sort-btns">' +
                    '<button type="button" class="btn-sort" onclick="moveAccount(' + acc.id + ', \'up\')" ' + (isFirst ? 'disabled' : '') + ' aria-label="上へ">▲</button>' +
                    '<button type="button" class="btn-sort" onclick="moveAccount(' + acc.id + ', \'down\')" ' + (isLast ? 'disabled' : '') + ' aria-label="下へ">▼</button>' +
                  '</span>'
                : '') +
              '<button type="button" class="btn-text" onclick="startEdit(' + acc.id + ')">編集</button>' +
              '<button type="button" class="btn-text danger" onclick="deleteAccount(' + acc.id + ')">削除</button>' +
            '</div>' +
          '</div>';
        listContainer.appendChild(item);
      });
    }

    /* ── 初期化 ── */
    loadData();
    loadUi();
    applyTheme();
    render();
  </script>
</body>
</html>
